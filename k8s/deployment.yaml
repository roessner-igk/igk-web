# Starter manifest for running the CV website in your cluster.
# Adjust the namespace, image tag, resources and ingress to fit your setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-igk
  labels:
    app: web-igk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-igk
  template:
    metadata:
      labels:
        app: web-igk
    spec:
      containers:
        - name: web-igk
          # Replace with the immutable sha tag from CI once you've verified latest works,
          # e.g. ghcr.io/samheyna/web-igk:sha-abcdef0
          image: ghcr.io/samheyna/web-igk:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web-igk
spec:
  selector:
    app: web-igk
  ports:
    - port: 80
      targetPort: 80

# If the GHCR package is private, pull secrets are required, e.g.:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<PAT with read:packages> \
#     -n <namespace>
# then reference it under spec.template.spec.imagePullSecrets.
#
# No Ingress is included here since it depends on your ingress controller
# and hostname — add one (or an HTTPRoute/IngressRoute) for your setup.
