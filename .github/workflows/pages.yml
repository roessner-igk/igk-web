name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          cp -r site _pages
          # Custom domain: CNAME file in repo root. Without it, serve under /web-igk/ (project URL).
          if [ -f CNAME ]; then
            cp CNAME _pages/CNAME
          else
            find _pages -name '*.html' -exec sed -i -E 's#(href|src)="/#\1="/web-igk/#g' {} +
            sed -i 's#url(/#url(/web-igk/#g' _pages/assets/style.css
          fi
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
